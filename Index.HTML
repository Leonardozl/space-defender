<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Space Defender</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    text-align:center;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

h1{
    margin:10px;
}

#score{
    font-size:24px;
    margin-bottom:10px;
}

canvas{
    background:#050520;
    border:2px solid white;
}

#gameOverScreen{
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#111;
    border:3px solid white;
    padding:30px;
    border-radius:10px;
    z-index:10;
}

#gameOverScreen h2{
    color:red;
    margin-top:0;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
    border:none;
    border-radius:5px;
    background:#00ccff;
    color:black;
    font-weight:bold;
}

button:hover{
    background:#00ffff;
}
</style>
</head>
<body>

<h1>🚀 Space Defender</h1>
<div id="score">Pontuação: 0</div>

<div id="gameOverScreen">
    <h2>💥 GAME OVER</h2>
    <p id="finalScore"></p>
    <button onclick="resetGame()">Jogar Novamente</button>
</div>

<canvas id="game" width="800" height="600"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let score = 0;
let gameOver = false;

const ship = {
    x: 375,
    y: 520,
    width: 50,
    height: 50,
    speed: 7
};

const bullets = [];
const enemies = [];
const keys = {};

document.addEventListener("keydown", e => {

    keys[e.key] = true;

    if(e.code === "Space" && !gameOver){

        bullets.push({
            x: ship.x + 22,
            y: ship.y,
            width: 5,
            height: 12,
            speed: 10
        });

    }

});

document.addEventListener("keyup", e => {
    keys[e.key] = false;
});

function spawnEnemy(){

    if(gameOver) return;

    enemies.push({
        x: Math.random() * (canvas.width - 40),
        y: -40,
        width: 40,
        height: 40,
        speed: 2 + Math.random() * 3
    });
}

setInterval(spawnEnemy,1000);

function showGameOver(){

    gameOver = true;

    document.getElementById("finalScore").innerHTML =
        "Pontuação Final: <b>" + score + "</b>";

    document.getElementById("gameOverScreen").style.display =
        "block";
}

function resetGame(){

    score = 0;

    bullets.length = 0;
    enemies.length = 0;

    ship.x = 375;
    ship.y = 520;

    gameOver = false;

    document.getElementById("score").innerText =
        "Pontuação: 0";

    document.getElementById("gameOverScreen").style.display =
        "none";
}

function update(){

    if(gameOver) return;

    if(keys["ArrowLeft"]){
        ship.x -= ship.speed;
    }

    if(keys["ArrowRight"]){
        ship.x += ship.speed;
    }

    ship.x = Math.max(
        0,
        Math.min(canvas.width - ship.width, ship.x)
    );

    for(let i = bullets.length - 1; i >= 0; i--){

        bullets[i].y -= bullets[i].speed;

        if(bullets[i].y < 0){
            bullets.splice(i,1);
        }
    }

    for(let i = enemies.length - 1; i >= 0; i--){

        enemies[i].y += enemies[i].speed;

        if(enemies[i].y > canvas.height){

            showGameOver();
            return;
        }

        for(let j = bullets.length - 1; j >= 0; j--){

            const e = enemies[i];
            const b = bullets[j];

            if(
                b.x < e.x + e.width &&
                b.x + b.width > e.x &&
                b.y < e.y + e.height &&
                b.y + b.height > e.y
            ){

                enemies.splice(i,1);
                bullets.splice(j,1);

                score += 10;

                document.getElementById("score").innerText =
                    "Pontuação: " + score;

                break;
            }
        }
    }
}

function drawStars(){

    ctx.fillStyle = "white";

    for(let i = 0; i < 100; i++){

        ctx.fillRect(
            (i * 131) % canvas.width,
            (i * 79) % canvas.height,
            2,
            2
        );
    }
}

function drawShip(){

    ctx.fillStyle = "#00ffff";

    ctx.beginPath();

    ctx.moveTo(ship.x + 25, ship.y);
    ctx.lineTo(ship.x, ship.y + 50);
    ctx.lineTo(ship.x + 50, ship.y + 50);

    ctx.closePath();
    ctx.fill();
}

function drawBullets(){

    ctx.fillStyle = "yellow";

    bullets.forEach(b => {
        ctx.fillRect(
            b.x,
            b.y,
            b.width,
            b.height
        );
    });
}

function drawEnemies(){

    enemies.forEach(enemy => {

        ctx.fillStyle = "red";

        ctx.fillRect(
            enemy.x,
            enemy.y,
            enemy.width,
            enemy.height
        );

        ctx.fillStyle = "orange";

        ctx.fillRect(
            enemy.x + 10,
            enemy.y + 10,
            20,
            20
        );
    });
}

function gameLoop(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawStars();

    update();

    drawShip();
    drawBullets();
    drawEnemies();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
